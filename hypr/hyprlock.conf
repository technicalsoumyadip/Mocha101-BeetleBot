source = ~/.config/hypr/hyprlock/themes/current.conf

general {
    disable_loading_bar = true
    grace = 300
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 6
    color = $background
}

input-field {
    monitor =
    size = 1000, 90
    outline_thickness = 0
    dots_size = 0.75
    dots_spacing = 0.75
    dots_center = true
    outer_color = 00000000
    inner_color = 00000000
    font_color = rgb(cdd6f4)
    fade_on_empty = true
    font_family = iMWritingMono Nerd Font Propo
    font_size = 45
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}