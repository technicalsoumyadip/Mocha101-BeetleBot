# General
windowrule = suppress_event maximize, match:class .* 
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0 
windowrule = no_blur on, match:class ^()$, match:title ^()$ 

# Thunar
windowrule = float on, match:class ^(thunar)$, match:title ^(File Operation Progress)$
windowrule = float on, match:class ^(thunar)$, match:title ^(Confirm to replace files)$
windowrule = float on, match:class ^(thunar)$, match:title ^(Rename.*)$
windowrule = center on, match:class ^(thunar)$, match:title ^(Rename.*)$
windowrule = size 400 150, match:class ^(thunar)$, match:title ^(Rename.*)$

# File pickers
windowrule = float on, match:class ^(xdg-desktop-portal-gtk)$
windowrule = size 800 500, match:class ^(xdg-desktop-portal-gtk)$
windowrule = center on, match:class ^(xdg-desktop-portal-gtk)$

# Rofi
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.5, match:namespace rofi

# Waybar
layerrule = blur on, match:namespace waybar 
layerrule = ignore_alpha 0.5, match:namespace waybar 

# Hyprlock
layerrule = blur on, match:namespace hyprlock
layerrule = ignore_alpha 0.2, match:namespace hyprlock

# SwayNC
layerrule = blur on, match:namespace swaync-notification-window 
layerrule = ignore_alpha 0.2, match:namespace swaync-notification-window 
layerrule = blur on, match:namespace swaync-control-center 
layerrule = ignore_alpha 0.2, match:namespace swaync-control-center 

# Picture-in-picture
windowrule = float on, match:title ^(Picture-in-Picture)$ 
windowrule = pin on, match:title ^(Picture-in-Picture)$ 
windowrule = no_initial_focus on, match:title ^(Picture-in-Picture)$ 
windowrule = size 324 181, match:title ^(Picture-in-Picture)$ 
windowrule = move (monitor_w-329) (monitor_h-212), match:title ^(Picture-in-Picture)$ 
windowrule = animation slide right, match:title ^(Picture-in-Picture)$ 
windowrule = keep_aspect_ratio on, match:title ^(Picture-in-Picture)$ 

# Special workspace
workspace = special:magic, gapsout:60 150 60 150, gapsin:15
windowrule = move 10% 5%, match:workspace special:magic 
windowrule = size 80% 50%, match:workspace special:magic 

# Connectivity
windowrule = float on, match:class ^(impala)$ 
windowrule = size 950 600, match:class ^(impala)$ 
windowrule = center on, match:class ^(impala)$ 
windowrule = float on, match:class ^(bluetui)$ 
windowrule = size 900 500, match:class ^(bluetui)$ 
windowrule = center on, match:class ^(bluetui)$

# Terminal modules
windowrule = float on, match:class ^(update-terminal)$
windowrule = center on, match:class ^(update-terminal)$
windowrule = size 1000 600, match:class ^(update-terminal)$

# Sushi
windowrule = float on, match:class ^(org.gnome.NautilusPreviewer)$
windowrule = center on, match:class ^(org.gnome.NautilusPreviewer)$
windowrule = size 800 600, match:class ^(org.gnome.NautilusPreviewer)$