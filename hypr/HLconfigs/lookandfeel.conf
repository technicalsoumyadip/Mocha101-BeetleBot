# Source
source = ~/.config/hypr/HLconfigs/theme-colors.conf

# General
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $active_border
    col.inactive_border = $inactive_border
    resize_on_border = true
    allow_tearing = false
    layout = scrolling
}

# Layouts
scrolling {
    column_width = 0.8
    fullscreen_on_one_column = false
}

master {
    new_status = slave
    new_on_top = false
    mfact = 0.60
    orientation = left
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# Decoration
decoration {
    rounding = 10
    rounding_power = 2.0
    active_opacity = 0.95
    inactive_opacity = 0.95

    blur {
        enabled = yes
        size = 10
        passes = 4
        new_optimizations = on
        vibrancy = 1
    }

    shadow {
        enabled = true
        ignore_window = true
        range = 20
        offset = 0 2
        render_power = 4
        color = rgba(00000044)
        color_inactive = rgba(00000022)
    }
}

# Group
group {
    col.border_active = $active_border
    col.border_inactive = $inactive_border

    groupbar {
        font_family = iMWritingMono Nerd Font Propo
        font_size = 13
        height = 24
        render_titles = true
        scrolling = true
        gradients = true
        col.active = $group_active
        col.inactive = $group_inactive
        text_color = rgba(1e1e2eff)
    }
}

# Animations
animations {
    enabled = yes

    bezier = fast, 0, 1, 0, 1
    bezier = defaultBezier, 0.05, 0.9, 0.1, 1.05

    animation = windowsIn, 1, 7, defaultBezier, popin 80%
    animation = windowsOut, 1, 2, fast, popin 100%
    animation = windowsMove, 1, 2, fast
    animation = fade, 1, 2, fast
    animation = fadeIn, 1, 2, fast
    animation = fadeOut, 1, 2, fast
    animation = workspaces, 1, 4, defaultBezier, slide
    animation = specialWorkspace, 1, 3, defaultBezier, fade
    animation = layers, 1, 2, fast, fade
}

# Misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}
