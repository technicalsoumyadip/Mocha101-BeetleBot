# SOURCE #
source = ~/.config/hypr/HLconfigs/theme-colors.conf

# GENERAL #
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 0
    col.active_border = $active_border
    col.inactive_border = $inactive_border
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

# LAYOUTS #
master {
    new_status = slave
    new_on_top = false
    mfact = 0.60
    orientation = left
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# DECORATION #
decoration {
    rounding = 10
    rounding_power = 2.0
    active_opacity = 0.95
    inactive_opacity = 0.95

    blur {
        enabled = yes
        size = 5
        passes = 2 
        new_optimizations = on
        vibrancy = 1
    }

    shadow {
        enabled = true
        ignore_window = true
        range = 15
        offset = 0 0
        render_power = 50
        color = $active_border
        color_inactive = $inactive_border
    }
}

# GROUP #
group {
    col.border_active = $active_border
    col.border_inactive = $inactive_border

    groupbar {
        font_family = iMWritingMono Nerd Font Propo
        font_size = 13
        height = 24
        render_titles = true
        scrolling = true
        gradients = true
        col.active = $group_active
        col.inactive = $group_inactive
        text_color = rgba(1e1e2eff)
    }
}

# ANIMATIONS #
animations {
    enabled = yes

    # The fast curve for your UI and closing windows
    bezier = fast, 0, 1, 0, 1
    
    # Hyprland's default curve (smooth with a very tiny bounce)
    bezier = defaultBezier, 0.05, 0.9, 0.1, 1.05

    # OPENING WINDOWS: Uses the default Hyprland animation (duration 7, popin 80%)
    animation = windowsIn, 1, 7, defaultBezier, popin 80%

    # CLOSING & MOVING WINDOWS: Kept extremely fast and stationary
    animation = windowsOut, 1, 2, fast, popin 100%
    animation = windowsMove, 1, 2, fast

    # FADES: Lightning fast (duration 2)
    animation = fade, 1, 2, fast
    animation = fadeIn, 1, 2, fast
    animation = fadeOut, 1, 2, fast

    # WORKSPACES: Short slide to give a sense of direction
    animation = workspaces, 1, 3, fast, slide
    animation = specialWorkspace, 1, 3, fast, fade

    # LAYERS: Keeps SwayNC and Waybar from sliding from the top
    animation = layers, 1, 2, fast, fade
}

# MISC #
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}
